; ============================================================
;  EGG ESP32-S3 固件  —  PlatformIO 工程配置
; ------------------------------------------------------------
;  内核 : arduino-esp32 3.x（经 pioarduino 社区平台）
;  目的 : 打开 CONFIG_PM_ENABLE + Tickless Idle，
;         让自动 light-sleep 真正生效（即让开机日志里
;         那行 “⚠ esp_pm_configure 失败” 变成 “✓”）。
;
;  ★ 为什么不用官方 espressif32 平台？
;    官方 platform=espressif32 目前只支持到 arduino-esp32
;    2.0.17，跑不了你的 3.x 内核 + NimBLE 2.5.0。
;    arduino-esp32 3.x 在 PlatformIO 上由社区 pioarduino
;    分支维护，下面 platform= 那一行就是它。
; ============================================================

[env:esp32s3]
; ── 平台：pioarduino（支持 arduino-esp32 3.x）──
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board     = esp32-s3-devkitc-1

; ── 串口 ──
monitor_speed = 115200
upload_speed  = 921600
; 看中文日志不乱码（可选）
monitor_filters = esp32_exception_decoder

; ── Flash / PSRAM ──────────────────────────────────────────
;  你的模组 = WROOM-1 N16R8：16MB Flash + 8MB OPI PSRAM
;  memory_type = qio_opi 表示「Flash 用 QIO，PSRAM 用 OPI(八线)」
;  ★ 若烧录后 PSRAM 初始化失败 / 不断重启，第一嫌疑就是这里，
;    去 Arduino IDE 的 工具 菜单核对 PSRAM 类型再改（见 README 第6节）
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.f_flash             = 80000000L
board_upload.flash_size         = 16MB
board_build.partitions          = partitions.csv
board_build.filesystem          = littlefs

; ── 关键：打开电源管理 + Tickless Idle ─────────────────────
;  这是 pioarduino 独有的 custom_sdkconfig（混合模式），
;  能在不脱离 Arduino 框架的前提下改 ESP-IDF 的 sdkconfig。
;  这几行就是让 light-sleep 生效的全部魔法。
custom_sdkconfig =
    CONFIG_PM_ENABLE=y
    CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
    CONFIG_FREERTOS_HZ=1000
    CONFIG_PM_DFS_INIT_AUTO=y
    CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240=y

; ── 编译选项 ──
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ── 库依赖（版本与你 Arduino IDE 里完全一致，钉死防 API 不兼容）──
lib_deps =
    bblanchon/ArduinoJson@6.21.6
    madhephaestus/ESP32Servo@3.2.1
    lovyan03/LovyanGFX@1.2.21
    h2zero/NimBLE-Arduino@2.5.0
    knolleary/PubSubClient@2.8
    https://github.com/lahavg/QMI8658-Arduino-Library
