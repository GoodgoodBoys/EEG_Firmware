; ============================================================
;  EGG ESP32-S3 固件  —  PlatformIO 工程配置
; ------------------------------------------------------------
;  内核 : arduino-esp32 3.x（经 pioarduino 社区平台）
;  目的 : 打开 CONFIG_PM_ENABLE + Tickless Idle，
;         让自动 light-sleep 真正生效（即让开机日志里
;         那行 “⚠ esp_pm_configure 失败” 变成 “✓”）。
;
;  ★ 为什么不用官方 espressif32 平台？
;    官方 platform=espressif32 目前只支持到 arduino-esp32
;    2.0.17，跑不了你的 3.x 内核 + NimBLE 2.5.0。
;    arduino-esp32 3.x 在 PlatformIO 上由社区 pioarduino
;    分支维护，下面 platform= 那一行就是它。
; ============================================================

[env:esp32s3]
; ── 平台：pioarduino（支持 arduino-esp32 3.x）──
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board     = esp32-s3-devkitc-1

; ── 串口 ──
monitor_speed = 115200
upload_speed  = 921600
; 看中文日志不乱码（可选）
monitor_filters = esp32_exception_decoder

; ── Flash / PSRAM ──────────────────────────────────────────
;  你的模组 = WROOM-1 N16R8：16MB Flash + 8MB OPI PSRAM
;  memory_type = qio_opi 表示「Flash 用 QIO，PSRAM 用 OPI(八线)」
;  ★ 若烧录后 PSRAM 初始化失败 / 不断重启，第一嫌疑就是这里，
;    去 Arduino IDE 的 工具 菜单核对 PSRAM 类型再改（见 README 第6节）
; ── 覆盖 board 自带的 extra_flags，只为改 ARDUINO_USB_MODE ─────────
;  board 定义（esp32-s3-devkitc-1.json）里是 -DARDUINO_USB_MODE=1，而本工程要 0。
;  原来的写法是在下面 build_flags 里再写一遍 -DARDUINO_USB_MODE=0，结果是【同一个宏
;  被定义两次且值不同】→ 每个编译单元都报 "ARDUINO_USB_MODE redefined"。
;  平时只是 warning，但 IDF 组件（wpa_supplicant / esp-modbus …）编译时带 -Werror，
;  警告即错误 —— 这就是本工程【从零全量编译过不去】的真正病根，一直被增量编译
;  掩盖着（有 .pio/build 历史产物时那些组件不重编，就碰不到 -Werror）。
;  这里整体覆盖 board 的 extra_flags，让该宏只被定义一次，最终值仍是 0，
;  与改动前的运行行为完全一致（Serial 仍走 UART0，因为 CDC_ON_BOOT 未定义）。
;  ⚠ 另外三个 flag 必须原样保留：ARDUINO_RUNNING_CORE=1 决定 setup/loop 跑在 core1，
;    动它会改变整个任务分核布局。
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.f_flash             = 80000000L
board_upload.flash_size         = 16MB
board_build.partitions          = partitions.csv
board_build.filesystem          = littlefs

; ── 关键：打开电源管理 + Tickless Idle ─────────────────────
;  这是 pioarduino 独有的 custom_sdkconfig（混合模式），
;  能在不脱离 Arduino 框架的前提下改 ESP-IDF 的 sdkconfig。
;  这几行就是让 light-sleep 生效的全部魔法。
;
;  末尾那行 FMB 与本工程功能无关，是【补上游漏掉的一项】，专治"全量重编译过不去"：
;    Arduino 预编译库的 sdkconfig 把 CONFIG_FMB_MASTER_TIMEOUT_MS_RESPOND 设成了
;    10000，却没有相应设置 CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS。库里的
;    esp-modbus 是早就编译好的二进制，所以这个矛盾一直藏着；一旦触发全量重编译，
;    Kconfig 用默认值 6000 去对 10000，esp-modbus 的静态断言
;    "MAX_API_BLOCKING_TIME_MS 必须 >= TIMEOUT_MS_RESPOND" 立刻失败，整个构建挂掉。
;    本工程完全不用 Modbus，但只要它在 managed_components 里就会被编译，躲不开。
;  ⚠ 别删这行：删了下次全量重编译（改任何 sdkconfig 项都会触发）就会再挂一次。
custom_sdkconfig =
    CONFIG_PM_ENABLE=y
    CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
    CONFIG_FREERTOS_HZ=1000
    CONFIG_PM_DFS_INIT_AUTO=y
    CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240=y
    CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=10000
    CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y

; ── (可选) 视频卡顿"成因A"的硬件级根治：flash 写自动挂起 ──────────────
;  开启后：persistTask(core1) 写/擦 flash 期间，若 core0(LCD) 需要读 flash/PSRAM
;  cache，硬件会【自动挂起】正在进行的 flash 编程/擦除、放行 core0 读取、再恢复写
;  —— 渲染不再被冻结。这是彻底消除"落盘冻结渲染"的根本手段，与代码里的防卡顿让路
;  (成因B, 已改)互补：B 让落盘尽量不在播放时发生，本项让"万一发生也不卡"。
;
;  ★ 风险：依赖 flash 芯片支持 suspend/resume(SUS 位)。WROOM-1 常见 GD 系 flash 支持，
;    但换料/个别批次可能不支持 → 表现为写 flash 时偶发崩溃/卡死。故默认【注释关闭】。
;  ★ 启用步骤：取消下面一行的注释 → 必须【整片擦除后重新烧录】：
;       pio run -t erase   然后   pio run -t upload
;    验证：连续收几个视频 + 快速切换，确认不崩、卡顿消失。
;  ★ 回退：把该行注释回去，再次【全擦重烧】即可。
;    CONFIG_SPI_FLASH_AUTO_SUSPEND=y

; ── 编译选项 ──
build_flags =
    -DBOARD_HAS_PSRAM
    ; CORE_DEBUG_LEVEL 3(INFO)→1(ERROR)：去掉 Arduino/IDF 框架的 INFO/WARN 日志字符串，
    ; 省几十 KB .flash.rodata（OTA 场景固件越小越好）。设备诊断另有健康黑匣子，不依赖框架日志。
    -DCORE_DEBUG_LEVEL=1
    ; ARDUINO_USB_MODE 已上移到 board_build.extra_flags（见上方说明）——
    ; 在这里重复定义会与 board 定义冲突，IDF 组件带 -Werror 时直接编译失败。
    ; -DARDUINO_USB_CDC_ON_BOOT=1


; ── 库依赖（版本与你 Arduino IDE 里完全一致，钉死防 API 不兼容）──
lib_deps =
    bblanchon/ArduinoJson@6.21.6
    madhephaestus/ESP32Servo@3.2.1
    lovyan03/LovyanGFX@1.2.21
    h2zero/NimBLE-Arduino@2.5.0
    knolleary/PubSubClient@2.8
    https://github.com/lahavg/QMI8658-Arduino-Library
